<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <!-- 相対パス（apps/ maps/ pois/ assets/ imgs/ img/）をすべて ../app/ 基準で解決させる。
       app/ はエクスポート一式の置き場で、このファイルからは一切手を加えない。 -->
  <base href="../app/">
  <title>Maplat Demo Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="assets/maplat_ui.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    .mainview { width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div class="mainview">
    <div id="map_div"></div>
  </div>

  <!-- CDN 依存は app/index.html と同じものを使う（app 側を更新したらここも同期すること） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css" integrity="sha384-gNYNsUmuZqDYiT3gbirWTV5K7rt71RoveS/yXAaU09d4ZUmeDVTD3XoqB6uJAIFR" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js" integrity="sha384-1qC0PnXk2fgMDybOtZF1ui4LM5Sxm7o0TbEkwfxTTVdlZvuNENNGCKUub7d644HP" crossorigin="anonymous"></script>
  <script src="assets/ol.js"></script>
  <script src="assets/maplat_ui.umd.js"></script>
  <script>
    // デモ埋め込み用オプション。公開版 app/index.html との差分:
    //   pwaManifest: false … SW/manifest はデモに不要（SW 404 も出さない）
    //   stateUrl: false    … デモ側で URL を書き換えない
    //   enableShare: false … 共有 UI を出さない
    var option = {
      "appid": "hiroshima",
      "overlay": true,
      "enableHideMarker": true,
      "enableMarkerList": true,
      "enableBorder": true,
      "enableCache": false,
      "pwaManifest": false,
      "stateUrl": false,
      "enableShare": false,
      "googleApiKey": "AIzaSyB0v_F9EVPbE7R2uOm6Mixrtzts21DEICc"
    };
    var MaplatApp = window.MaplatUi && window.MaplatUi.createObject
      ? window.MaplatUi
      : window.MaplatUi && window.MaplatUi.MaplatUi
        ? window.MaplatUi.MaplatUi
        : window.Maplat;
    // 親（スライドショー）が同一オリジンから拾えるよう、インスタンスを window に置く
    MaplatApp.createObject(option).then(function (app) {
      window.maplatApp = app;
      try { parent.postMessage({ type: "maplat-ready" }, "*"); } catch (e) { }
    }).catch(function (e) {
      window.maplatError = String(e && e.message || e);
      try { parent.postMessage({ type: "maplat-error", message: window.maplatError }, "*"); } catch (e2) { }
    });
  </script>
</body>

</html>

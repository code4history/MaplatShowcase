<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO-A 往復（2 面同期）— ARIDA デモ</title>
<style>
  /* 1200×800 の収録面。中の canvas は lib/mapview.mjs が描く */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0b0f18;
    overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, -apple-system, sans-serif;
  }
  /* 収録（Playwright）の viewport は 1200×800。面は固定して縮めない */
  #stage {
    position: relative;
    width: 1200px;
    height: 800px;
    display: grid;
    grid-template-columns: 600px 600px;
    grid-template-rows: 800px;
    background: #0f1420;
    overflow: hidden;
  }
  .pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #0f1420;
  }
  .pane canvas {
    display: block;
    width: 600px;
    height: 800px;
    touch-action: none;
  }
  /* 左右の境目。canvas の上に 2px だけ重ねる（操作は奪わない） */
  #divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 599px;
    width: 2px;
    background: #39445a;
    z-index: 6;
    pointer-events: none;
  }
  .pane-label {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 5;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(15, 20, 32, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e7ecf3;
    font-size: 20px; /* v2.8: 14 → 20px（見た目のレビュー visual 1） */
    line-height: 1.3;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 右面のラベルは Panel（右上）と地図の出典（右下）を避けて下中央に置く */
  .pane-label--bottom {
    top: auto;
    bottom: 12px;
    left: 46%; /* v2.8: 20px にしたぶん、右下の「地理院タイル」と重ならないよう少し左へ */
    transform: translateX(-50%);
    white-space: nowrap;
  }
  /* 出典は左下に常時表示（要件書 §3・§4） */
  #source {
    position: absolute;
    left: 16px;
    bottom: 16px;
    z-index: 10;
    max-width: calc(100% - 32px);
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(15, 20, 32, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e7ecf3;
    font-size: 18px; /* v2.8: 14 → 16px・v2.9（visual 1 の残り）: 18px */
    line-height: 1.4;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* データ読み込みの失敗・?data= の警告。地図を隠さない位置に出す */
  #data-note {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    max-width: 720px;
    padding: 8px 14px;
    border-radius: 10px;
    background: rgba(179, 38, 30, 0.92);
    color: #fff;
    font-size: 15px;
    line-height: 1.5;
    pointer-events: none;
  }
  /* 題材の切替（strict／loose）と「収録の点へ寄る」。左面の上（ラベルの下）に置く */
  #data-buttons {
    position: absolute;
    top: 54px; /* v2.8: ラベルが 20px になったぶん 8px 下げた（位置は左面の上のまま） */
    left: 12px;
    z-index: 12;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 576px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(15, 20, 32, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.2);
    -webkit-user-select: none;
    user-select: none;
  }
  #data-buttons button {
    padding: 7px 12px;
    border-radius: 9px;
    /* v2.9（visual 13 の残り）: 押していないボタンは紙色 85%・墨の文字（押した状態＝墨地・白字と見分ける） */
    border: 1px solid rgba(49, 45, 42, 0.35);
    background: rgba(255, 255, 255, 0.85);
    color: #312D2A;
    font: inherit;
    font-size: 20px; /* v2.8: 15 → 20px */
    font-weight: 700;
    cursor: pointer;
  }
  #data-buttons button:hover { background: rgba(255, 255, 255, 0.95); }
  /* v2.8（visual 13）: 押した状態は 4 本とも ink 地・白字。状態の色（strict 緑・loose 橙・赤）と分ける */
  #data-buttons button[aria-pressed="true"] { background: #312D2A; border-color: #ffffff; color: #fff; box-shadow: 0 0 0 2px #ffffff inset; }
  #data-buttons button:disabled { opacity: 0.5; cursor: wait; }
  /* v3.5: タッチ（粗いポインタ）ではボタンを押せる高さに。--tap は stage-fit.mjs が縮尺 k から出す（収録面の px） */
  @media (pointer: coarse) { #stage button { min-height: var(--tap, 36px); } }
</style>
</head>
<body>
<div id="stage">
  <section class="pane" id="pane-left">
    <canvas id="map-left"></canvas>
    <div class="pane-label">地図面: 古地図（絵図ピクセル）</div>
    <div id="data-buttons" role="group" aria-label="題材">
      <button type="button" data-name="kaisei_hiroshima_jissoku" aria-pressed="true">strict（元データ）</button>
      <button type="button" data-name="kaisei_hiroshima_jissoku.pairswap-loose" aria-pressed="false">loose（対応点 1 組を入れ替えた派生）</button>
      <button type="button" id="go-point">収録の点へ寄る</button>
    </div>
  </section>
  <section class="pane" id="pane-right">
    <canvas id="map-right"></canvas>
    <div class="pane-label pane-label--bottom">地理面: 現代地図（地理院タイル・メルカトル）</div>
  </section>
  <div id="divider"></div>
  <div id="source">出典: 読み込み中…</div>
  <div id="data-note" hidden></div>
</div>

<!-- v3.5: 狭い画面（スマホ）では #stage を縮尺 k で画面に収める（1200×800 以上では何もしない ∴ 収録は変わらない） -->
<script type="module">import { fitStage } from './lib/stage-fit.mjs'; fitStage();</script>
<script type="module" src="./demo-a.mjs"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO-B 端を越えても連続（2 面）— ARIDA デモ</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b0f18; overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
  #stage { position: relative; width: 1200px; height: 800px; display: grid; grid-template-columns: 600px 600px;
    grid-template-rows: 800px; background: #0f1420; overflow: hidden; }
  .pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0f1420; }
  .pane canvas { display: block; width: 600px; height: 800px; touch-action: none; }
  #divider { position: absolute; top: 0; bottom: 0; left: 599px; width: 2px; background: #39445a; z-index: 6; pointer-events: none; }
  .pane-label { position: absolute; top: 12px; left: 12px; z-index: 5; padding: 4px 10px; border-radius: 8px;
    background: rgba(15,20,32,.72); border: 1px solid rgba(255,255,255,.16); color: #e8edf5; font-size: 20px; pointer-events: none; }
  /* 領域の帯は左面の右上（下部中央の字幕帯と、左下へ伸びる凸包・左上へ向かうカーソル経路を避ける） */
  #band { position: absolute; top: 12px; right: 612px; max-width: 560px; box-sizing: border-box; z-index: 7; padding: 8px 14px; border-radius: 10px; color: #fff;
    font-size: 24px; font-weight: 700; background: rgba(27,122,61,.92); box-shadow: 0 2px 10px rgba(0,0,0,.35); pointer-events: none;
    transition: background .15s; }
  #band[data-zone="extrap"] { background: rgba(21,101,192,.94); }
  #band[data-zone="outside"] { background: rgba(93,64,55,.94); }
  #band small { display: block; font-size: 20px; font-weight: 400; opacity: .92; }
  #source { position: absolute; left: 12px; bottom: 12px; z-index: 5; padding: 4px 10px; border-radius: 8px;
    background: rgba(15,20,32,.72); color: #e8edf5; font-size: 18px; pointer-events: none; } /* v2.9: 16 → 18px */
  #fatal { position: absolute; inset: 0; display: none; place-items: center; z-index: 50; background: rgba(0,0,0,.8); color: #fff; font-size: 22px; padding: 40px; }
  /* 凡例（資料 #10 の図 imageBoundsView の語・線種に、域の色（帯と同じ緑・青・茶）を足したもの）。
     右面の左上・面の札の下に置く（左面に置くと絵図の四辺形の上辺と上の 2 隅を隠す。下端は収録の字幕帯） */
  /* v2.8（visual 1・14）: 14px → 20px。地図を隠す面積を増やさないよう行間を 1.5 → 1.22 に詰め、語を短くした */
  #legend { position: absolute; left: 612px; top: 58px; z-index: 7; padding: 6px 10px; border-radius: 10px;
    background: rgba(255,255,255,.92); color: #312D2A; font-size: 20px; line-height: 1.22; pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #legend .ttl { color: #C46A00; font-weight: 700; }
  #legend svg { width: 34px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  /* v3.5: タッチ（粗いポインタ）ではボタンを押せる高さに。--tap は stage-fit.mjs が縮尺 k から出す（収録面の px） */
  @media (pointer: coarse) { #stage button { min-height: var(--tap, 36px); } }
</style>
</head>
<body>
<div id="stage">
  <section class="pane"><canvas id="map-left"></canvas><div class="pane-label">古地図（絵図）</div></section>
  <section class="pane"><canvas id="map-right"></canvas><div class="pane-label" style="left:612px">現代地図（地理院タイル）</div></section>
  <div id="divider"></div>
  <div id="band" data-zone="inside">対応点の凸包の内側<small>カーソル下の点を現代地図へ変換中</small></div>
  <div id="legend">
    <div class="ttl">画像の外側の扱い</div>
    <div><svg viewBox="0 0 34 16"><path d="M2 14 L12 3 L32 6" fill="none" stroke="#312D2A" stroke-width="3"/><circle cx="12" cy="3" r="2.5" fill="#312D2A"/></svg>対応点と凸包（実線）</div>
    <div><svg viewBox="0 0 34 16"><path d="M2 13 L12 3 L22 13 L32 3" fill="none" stroke="#1B7A3D" stroke-width="2"/></svg>凸包の内の三角網</div>
    <div><svg viewBox="0 0 34 16"><path d="M2 13 L12 3 L22 13 L32 3" fill="none" stroke="#1565C0" stroke-width="2"/></svg>凸包の外の三角網（予測点まで）</div>
    <div><svg viewBox="0 0 34 16"><path d="M1 8 H24" fill="none" stroke="#1565C0" stroke-width="3" stroke-dasharray="6 4"/><circle cx="27" cy="8" r="6" fill="#F29111" stroke="#fff" stroke-width="1.5"/></svg>画像の四辺形と四隅の予測点</div>
    <div><svg viewBox="0 0 34 16"><path d="M4 14 L14 2 M14 14 L32 4" fill="none" stroke="#5A3A1E" stroke-width="3"/></svg>四辺形の外の無限大三角形</div>
    <div><svg viewBox="0 0 34 16"><path d="M4 14 L17 2 L30 14 Z" fill="rgba(249,178,43,.3)" stroke="#F9B22B" stroke-width="2.6" stroke-linejoin="round"/></svg>いま変換に使っている三角形</div>
  </div>
  <div id="source">出典: 読み込み中…</div>
  <div id="fatal"></div>
</div>
<!-- v3.5: 狭い画面（スマホ）では #stage を縮尺 k で画面に収める（1200×800 以上では何もしない ∴ 収録は変わらない） -->
<script type="module">import { fitStage } from './lib/stage-fit.mjs'; fitStage();</script>
<script type="module" src="./demo-b.mjs"></script>
</body>
</html>
